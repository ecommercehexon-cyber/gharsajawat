<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Ghar Sajawat</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:1100px;margin:auto;padding:55px 5%}.panel{border:1px solid #e8e0d4;padding:25px;background:#faf7f1}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form textarea,.form input,.form select{width:100%;padding:12px;border:1px solid #ddd;background:#fff}.form textarea{min-height:100px}.full{grid-column:1/-1}.save{background:#222;color:#fff;border:0;padding:13px 22px;border-radius:25px;cursor:pointer}.list{margin-top:30px}.row{display:grid;grid-template-columns:70px 1fr 100px 90px;gap:12px;align-items:center;border-bottom:1px solid #e8e0d4;padding:12px 0}.row img{width:65px;height:65px;object-fit:cover}.row button{border:1px solid #ddd;background:#fff;padding:7px;cursor:pointer}.note{color:#746f67;font-size:13px;line-height:1.6}@media(max-width:700px){.form{grid-template-columns:1fr}.row{grid-template-columns:55px 1fr}.row span:nth-child(3){display:none}}
</style></head><body><header><div class="topbar">Ghar Sajawat — Product Admin</div><div class="nav"><a class="logo" href="index.html"><img src="assets/logo.png" alt="Ghar Sajawat"></a><nav style="display:flex"><a href="index.html">Home</a><a href="index.html#shop">Shop</a></nav></div></header>
<main class="admin"><h1 style="font-family:'Playfair Display',serif">Manage products</h1><p class="note">Add or edit products here. Data is stored in this browser's local storage, so this static GitHub Pages version does not need a database.</p>
<div class="panel"><input type="hidden" id="id"><div class="form"><input id="name" placeholder="Product name"><input id="price" placeholder="Price e.g. ₹1,499"><select id="category"><option value="spiritual">Spiritual</option><option value="decor">Decor</option></select><input id="image" placeholder="Image path e.g. assets/product.jpg"><textarea class="full" id="description" placeholder="Product description"></textarea><input class="full" id="specs" placeholder="Specifications separated by |"><button class="save" id="save">Save product</button><button type="button" class="save" id="clear" style="background:#b8955d">Clear</button></div></div>
<div class="list" id="list"></div></main>
<script>
const defaults=[{id:1,name:'Buddha Water Fountain',category:'spiritual',price:'₹2,499',image:'assets/buddha-fountain.jpg',description:'A peaceful Buddha fountain designed to bring a calm focal point to your home.',specs:['Decorative Buddha fountain','Suitable for living room or meditation corner']},{id:2,name:'Meditating Buddha Decor',category:'spiritual',price:'₹1,499',image:'assets/buddha-statue.jpg',description:'Elegant meditation-inspired decor.',specs:['Meditating Buddha design','Neutral finish']}];
function get(){try{let x=JSON.parse(localStorage.getItem('gharSajawatProducts'));return Array.isArray(x)&&x.length?x:defaults}catch(e){return defaults}}
function set(x){localStorage.setItem('gharSajawatProducts',JSON.stringify(x))}
function clearForm(){['id','name','price','image','description','specs'].forEach(id=>document.getElementById(id).value='');document.getElementById('category').value='spiritual'}
function render(){let x=get();document.getElementById('list').innerHTML='<h2>Current products</h2>'+x.map(p=>`<div class="row"><img src="${p.image}"><span><b>${p.name}</b><br><small>${p.price}</small></span><span>${p.category}</span><span><button onclick="editP(${p.id})">Edit</button> <button onclick="deleteP(${p.id})">Delete</button></span></div>`).join('')}
function editP(id){let p=get().find(x=>x.id===id);if(!p)return;for(let k of ['id','name','price','image','description'])document.getElementById(k).value=p[k]||'';document.getElementById('category').value=p.category;document.getElementById('specs').value=(p.specs||[]).join(' | ');scrollTo(0,0)}
function deleteP(id){if(!confirm('Delete this product?'))return;set(get().filter(p=>p.id!==id));render()}
document.getElementById('save').onclick=()=>{let x=get(),id=document.getElementById('id').value;let p={id:id?Number(id):Date.now(),name:document.getElementById('name').value.trim(),price:document.getElementById('price').value.trim(),category:document.getElementById('category').value,image:document.getElementById('image').value.trim(),description:document.getElementById('description').value.trim(),specs:document.getElementById('specs').value.split('|').map(s=>s.trim()).filter(Boolean)};if(!p.name||!p.image){alert('Product name and image path are required.');return}if(id){x=x.map(q=>q.id===Number(id)?p:q)}else{x.push(p)}set(x);clearForm();render();alert('Product saved.')}
document.getElementById('clear').onclick=clearForm;render();
</script></body></html>
