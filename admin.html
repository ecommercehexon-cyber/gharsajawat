<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — GharSajawat</title><link rel="stylesheet" href="style.css"></head>
<body class="adminBody"><div class="adminWrap"><div class="adminTop"><div class="logo">Ghar<span>Sajawat</span></div><a href="index.html">View Store →</a></div>
<div id="login" class="panel"><h1>Admin Login</h1><p>Demo login for this starter website.</p><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><small>Demo password: <b>admin123</b></small></div>
<div id="dashboard" style="display:none"><div class="dashHead"><div><p class="eyebrow">ADMIN PANEL</p><h1>Products</h1></div><button class="btn" onclick="openForm()">+ Add Product</button></div>
<div id="form" class="panel" style="display:none"><h2 id="formTitle">Add Product</h2><input id="pName" placeholder="Product name"><select id="pCat"><option>Wall Decor</option><option>Table Decor</option><option>Lighting</option><option>Statues</option></select><input id="pPrice" type="number" placeholder="Price ₹"><input id="pOld" type="number" placeholder="MRP / old price ₹"><input id="pImg" placeholder="Image URL (optional)"><textarea id="pDesc" placeholder="Short description"></textarea><div class="row"><button class="btn" onclick="saveProduct()">Save Product</button><button class="ghost" onclick="closeForm()">Cancel</button></div></div>
<div id="adminProducts"></div></div></div><script src="admin.js"></script></body></html>
