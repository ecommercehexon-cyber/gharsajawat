<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Ghar Sajawat</title><link rel="stylesheet" href="style.css"><style>.detail{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:70px 8%}.detail-img{background:#f3eee6}.detail-img img{width:100%;aspect-ratio:1;object-fit:cover}.detail h1{font:600 48px/1.1 'Playfair Display',serif}.detail .price{font-size:25px;margin:20px 0}.detail p,.detail li{color:#746f67;line-height:1.8}.detail h3{font:600 22px 'Playfair Display',serif}.wa{display:inline-block;background:#214b3a;color:#fff;padding:14px 23px;border-radius:28px;font-weight:700;margin-top:14px}@media(max-width:750px){.detail{grid-template-columns:1fr;padding:40px 5%;gap:30px}.detail h1{font-size:36px}}</style></head><body>
<header><div class="topbar">✨ Beautiful decor for beautiful homes</div><div class="nav"><a class="logo" href="index.html"><img src="assets/logo.png" alt="Ghar Sajawat"></a><nav style="display:flex"><a href="index.html#home">Home</a><a href="index.html#shop">Shop</a><a href="index.html#about">About</a><a href="admin.html">Admin</a></nav></div></header>

<script src="app.js"></script><script>
const list=products(),id=new URLSearchParams(location.search).get('id'),p=list.find(x=>String(x.id)===String(id))||list[0];
